)}}.m16{opacity:0;animation:m16 20s ease-in-out infinite}@keyframes m17{0%,74.00%{opacity:0;transform:translate(0,0)}75.50%{opacity:1;transform:translate(0,0)}84.00%,89.00%{opacity:1;transform:translate(25px,40px)}91.50%,100%{opacity:0;transform:translate(25px,40px)}}.m17{opacity:0;animation:m17 20s ease-in-out infinite}@keyframes m18{0%,74.00%{opacity:0;transform:translate(0,0)}75.50%{opacity:1;transform:translate(0,0)}84.00%,89.00%{opacity:1;transform:translate(35px,-20px)}91.50%,100%{opacity:0;transform:translate(35px,-20px)}}.m18{opacity:0;animation:m18 20s ease-in-out infinite}@keyframes m19{0%,74.00%{opacity:0;transform:translate(0,0)}75.50%{opacity:1;transform:translate(0,0)}84.00%,89.00%{opacity:1;transform:translate(-25px,-25px)}91.50%,100%{opacity:0;transform:translate(-25px,-25px)}}.m19{opacity:0;animation:m19 20s ease-in-out infinite}@keyframes blink{0%,49%{opacity:1}50%,100%{opacity:0}}.cursor{animation:blink 1s steps(1) infinite}@media (prefers-reduced-motion: reduce){.a1,.a2,.a3,.a4,.a5,.a6,.a7,.a8,.a9,.g10,.a11,.m12,.m13,.m14,.m15,.m16,.m17,.m18,.m19{animation:none!important;opacity:1!important;transform:none!important}.cursor{animation:none!important}}</style><rect width="900" height="330" rx="10" fill="#141822" stroke="#2c3242"/><line x1="90" y1="56" x2="810" y2="56" stroke="#2c3242" stroke-width="3"/><circle cx="90" cy="56" r="22" fill="#232838" stroke="#3a4256"/><text x="90" y="62" font-size="17" font-weight="700" fill="#9aa3b8" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">1</text><g class="a1"><circle cx="90" cy="56" r="22" fill="#6c8cff"/><text x="90" y="62" font-size="17" font-weight="700" fill="#0e1117" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">1</text></g><text x="90" y="106" font-size="14" fill="#c7ccda" font-weight="600" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Charger la vidéo</text><circle cx="270" cy="56" r="22" fill="#232838" stroke="#3a4256"/><text x="270" y="62" font-size="17" font-weight="700" fill="#9aa3b8" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">2</text><g class="a2"><circle cx="270" cy="56" r="22" fill="#6c8cff"/><text x="270" y="62" font-size="17" font-weight="700" fill="#0e1117" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">2</text></g><text x="270" y="106" font-size="14" fill="#c7ccda" font-weight="600" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Détecter les games</text><circle cx="450" cy="56" r="22" fill="#232838" stroke="#3a4256"/><text x="450" y="62" font-size="17" font-weight="700" fill="#9aa3b8" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">3</text><g class="a3"><circle cx="450" cy="56" r="22" fill="#6c8cff"/><text x="450" y="62" font-size="17" font-weight="700" fill="#0e1117" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">3</text></g><text x="450" y="106" font-size="14" fill="#c7ccda" font-weight="600" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Vérifier les bornes</text><circle cx="630" cy="56" r="22" fill="#232838" stroke="#3a4256"/><text x="630" y="62" font-size="17" font-weight="700" fill="#9aa3b8" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">4</text><g class="a4"><circle cx="630" cy="56" r="22" fill="#6c8cff"/><text x="630" y="62" font-size="17" font-weight="700" fill="#0e1117" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">4</text></g><text x="630" y="106" font-size="14" fill="#c7ccda" font-weight="600" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Analyser</text><circle cx="810" cy="56" r="22" fill="#232838" stroke="#3a4256"/><text x="810" y="62" font-size="17" font-weight="700" fill="#9aa3b8" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">5</text><g class="a5"><circle cx="810" cy="56" r="22" fill="#6c8cff"/><text x="810" y="62" font-size="17" font-weight="700" fill="#0e1117" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">5</text></g><text x="810" y="106" font-size="14" fill="#c7ccda" font-weight="600" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Replay et stats</text><rect x="20" y="130" width="860" height="180" rx="8" fill="#1b1f2a" stroke="#2c3242"/><g class="a6"><rect x="50" y="170" width="120" height="34" rx="6" fill="#232838" stroke="#3a4256"/><text x="110" y="192" font-size="13" fill="#e6e8ee" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Parcourir…</text><rect x="184" y="170" width="520" height="34" rx="6" fill="#0e1117" stroke="#2c3242"/><text x="198" y="192" font-size="13" fill="#9aa3b8" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Colle un chemin .mp4 ou une URL YouTube</text><text x="50" y="250" font-size="13" fill="#c7ccda" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Onglet Analyse : un fichier .mp4 de ton disque ou un lien YouTube (1080p conseillé).</text></g><g class="a7"><rect x="50" y="170" width="170" height="34" rx="6" fill="#35e07a"/><text x="135" y="192" font-size="13" font-weight="700" fill="#0e1117" text-anchor="middle" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Détecter les games</text><text x="50" y="250" font-size="13" fill="#c7ccda" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Le chrono de chaque game est lu : environ 3 minutes pour une vidéo de 83 minutes.</text></g><g class="a8"><rect x="50" y="178" width="740" height="22" fill="#232838"/><rect x="50" y="178" width="110" height="22" fill="#35e07a"/><rect x="190" y="178" width="120" height="22" fill="#35e07a"/><rect x="340" y="178" width="150" height="22" fill="#35e07a"/><rect x="520" y="178" width="110" height="22" fill="#35e07a"/><rect x="660" y="178" width="130" height="22" fill="#35e07a"/><rect x="400" y="178" width="30" height="22" fill="#ff9f1c"/><text x="50" y="250" font-size="13" fill="#c7ccda" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Les bandes orange sont les passages incertains à vérifier : déplace les bornes si besoin, puis confirme.</text></g><g class="a9"><text x="50" y="190" font-size="13" fill="#c7ccda" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Analyse détaillée : coche les games, puis « Analyser la sélection »</text><rect x="50" y="204" width="620" height="16" rx="8" fill="#0e1117" stroke="#2c3242"/><rect class="g10" x="50" y="204" width="620" height="16" rx="8" fill="#6c8cff"/><text x="50" y="250" font-size="13" fill="#c7ccda" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Options, Priorité : basse (PC fluide), normale ou haute (plus rapide si le PC est occupé).</text></g><g class="a11"><rect x="90" y="150" width="260" height="130" rx="6" fill="#0e1117" stroke="#3a4256"/><circle class="m12" cx="110" cy="175" r="7" fill="#ff9f1c"/><circle class="m13" cx="330" cy="170" r="7" fill="#3d8bff"/><circle class="m14" cx="140" cy="245" r="7" fill="#ff9f1c"/><circle class="m15" cx="300" cy="250" r="7" fill="#3d8bff"/><circle class="m16" cx="170" cy="195" r="7" fill="#ff9f1c"/><circle class="m17" cx="270" cy="200" r="7" fill="#3d8bff"/><circle class="m18" cx="200" cy="260" r="7" fill="#ff9f1c"/><circle class="m19" cx="240" cy="265" r="7" fill="#3d8bff"/><text x="380" y="190" font-size="13" fill="#c7ccda" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Le replay rejoue les positions sur le plan,</text><text x="380" y="212" font-size="13" fill="#c7ccda" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">avec les kills, le score de capture et les noms.</text><text x="380" y="250" font-size="13" fill="#c7ccda" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">Onglet Armes : nomme les icônes inconnues.</text></g></svg>